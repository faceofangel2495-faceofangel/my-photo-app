<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>사진 보관함</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#182230;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 48px}
main{max-width:980px;margin:auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
h1{font-size:clamp(25px,4vw,34px);margin:0 0 6px}
p{margin:0;color:#657184;line-height:1.55}
h2{font-size:20px;margin:0}
.section{background:#fff;border:1px solid #e3e8ef;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 5px 18px #18223008}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid.extra{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{min-width:0}
.photo-name{display:block;width:100%;min-width:0;margin-top:8px;padding:9px 10px;border:1px solid #d9e1eb;border-radius:9px;background:#fff;color:#182230;font:inherit;font-size:14px;text-align:center}
.photo-name:focus{outline:2px solid #9bb9f5;border-color:#245edb}
.photo-name::placeholder{color:#9aa6b5}
.frame{position:relative;aspect-ratio:1/1;background:#f0f3f7;border:1px dashed #cbd4df;border-radius:13px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.empty{color:#8491a2;text-align:center;padding:8px;font-size:13px}
.slot{font-weight:700;color:#64748b;font-size:12px;margin-bottom:7px}
.actions{display:flex;gap:7px;margin-top:8px}
button,.file-label{font:inherit;border:0;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:650}
.primary{background:#245edb;color:white}
.secondary{background:#edf2f8;color:#26364a}
.danger{background:#fff0ef;color:#bd3028}
.small{font-size:13px;padding:7px 10px}
.file-label{display:inline-flex;align-items:center;justify-content:center;background:#245edb;color:#fff}
input[type=file]{display:none}
.count{font-size:13px;color:#657184;white-space:nowrap}
.note{font-size:13px;color:#718096;margin-top:14px}
.empty-list{grid-column:1/-1;text-align:center;padding:32px 12px;color:#8290a1;background:#fafbfd;border-radius:12px}
footer{font-size:12px;color:#7a8797;text-align:center;padding:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172235;color:white;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px #0002;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.viewer{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:#000;padding:0;overflow:hidden}
.viewer.open{display:flex}
.viewer img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center}
.viewer-back{position:absolute;z-index:2;top:max(12px,env(safe-area-inset-top));left:12px;width:44px;height:44px;padding:0;border-radius:50%;background:#0008;color:#fff;font-size:34px;line-height:1;font-weight:400;display:flex;align-items:center;justify-content:center}
body.viewer-open{padding:0;overflow:hidden}
@media(max-width:620px){
 body{padding:18px 12px 36px}
 .section{padding:15px;border-radius:15px}
 .grid{gap:7px}
 .grid.extra{grid-template-columns:repeat(3,minmax(0,1fr))}
 .photo-name{font-size:12px;padding:8px 7px}
 .actions{flex-wrap:wrap;gap:5px}
 button,.file-label{padding:8px 9px;font-size:13px}
 header{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<main>
<header>
 <div><h1>사진 보관함</h1><p>상단 사진 4장은 교체할 수 있고, 아래 사진은 자유롭게 추가·삭제할 수 있어요.</p></div>
 <span class="count" id="storageStatus">이 기기에 저장됩니다</span>
</header>

<section class="section">
 <div class="section-head"><h2>📌 시간표</h2><span class="count">항상 4칸 유지</span></div>
 <div class="grid" id="fixedGrid"></div>
</section>

<section class="section">
 <div class="section-head"><h2>📷 순번표</h2><span class="count" id="extraCount">0장</span></div>
 <div class="grid extra" id="extraGrid"></div>
 <div style="margin-top:16px">
  <label class="file-label" for="addFiles">＋ 사진 추가</label>
  <input id="addFiles" type="file" accept="image/*" multiple>
 </div>
 <p class="note">여러 장을 한 번에 선택할 수 있습니다. 추가 사진은 아래 영역에서 개별 삭제할 수 있습니다.</p>
</section>
<footer>사진은 이 브라우저의 로컬 저장공간에 보관됩니다. 다른 기기나 브라우저와 자동 동기화되지 않습니다.</footer>
</main>
<div class="toast" id="toast" role="status"></div>
<div class="viewer" id="photoViewer" role="dialog" aria-modal="true" aria-label="사진 전체 화면 보기">
 <button class="viewer-back" id="viewerBack" type="button" aria-label="뒤로가기">‹</button>
 <img id="viewerImage" alt="선택한 사진">
</div>
<script>
(() => {
  const DB_NAME = "local-photo-library-v1";
  const STORE = "photos";
  let db;

  const $ = id => document.getElementById(id);
  const viewer = $("photoViewer");
  const viewerImage = $("viewerImage");
  let viewerHistoryOpen = false;
  let viewerObjectUrl = null;

  function hideViewer() {
    viewer.classList.remove("open");
    document.body.classList.remove("viewer-open");
    viewerImage.removeAttribute("src");
    if (viewerObjectUrl) URL.revokeObjectURL(viewerObjectUrl);
    viewerObjectUrl = null;
    viewerHistoryOpen = false;
  }

  function openViewer(blob, alt) {
    if (viewerObjectUrl) URL.revokeObjectURL(viewerObjectUrl);
    viewerObjectUrl = URL.createObjectURL(blob);
    viewerImage.src = viewerObjectUrl;
    viewerImage.alt = alt || "선택한 사진";
    viewer.classList.add("open");
    document.body.classList.add("viewer-open");
    if (!viewerHistoryOpen) {
      history.pushState({photoViewer: true}, "");
      viewerHistoryOpen = true;
    }
  }

  function closeViewer() {
    if (!viewer.classList.contains("open")) return;
    if (viewerHistoryOpen) {
      history.back();
    } else {
      hideViewer();
    }
  }

  $("viewerBack").addEventListener("click", closeViewer);
  window.addEventListener("popstate", () => {
    if (viewer.classList.contains("open")) hideViewer();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && viewer.classList.contains("open")) closeViewer();
  });

  const toast = message => {
    const el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.remove("show"), 2300);
  };

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const database = req.result;
        if (!database.objectStoreNames.contains(STORE)) {
          const store = database.createObjectStore(STORE, {keyPath:"id", autoIncrement:true});
          store.createIndex("slot", "slot", {unique:true});
      }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function requestResult(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function tx(mode="readonly") {
    return db.transaction(STORE, mode).objectStore(STORE);
  }
  async function allPhotos() { return requestResult(tx().getAll()); }
  async function savePhoto(record) { return requestResult(tx("readwrite").put(record)); }
  async function deletePhoto(id) { return requestResult(tx("readwrite").delete(id)); }

  function imageURL(blob) { return URL.createObjectURL(blob); }

  function makeCard(record, slotIndex=null) {
    const card = document.createElement("article");
    card.className = "card";
    if (slotIndex !== null) {
      const label = document.createElement("div");
      label.className = "slot";
      label.textContent = `고정 사진 ${slotIndex + 1}`;
      card.append(label);
    }

    const frame = document.createElement("div");
    frame.className = "frame";
    if (record?.blob) {
      const img = document.createElement("img");
      img.src = imageURL(record.blob);
      img.alt = slotIndex === null ? "추가 사진" : `고정 사진 ${slotIndex+1}`;
      img.addEventListener("click", () => openViewer(record.blob, img.alt));
      frame.append(img);
    } else {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = slotIndex === null ? "사진 없음" : "사진을 등록해 주세요";
      frame.append(empty);
    }
    card.append(frame);

    if (record?.blob) {
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.className = "photo-name";
      nameInput.placeholder = "사진 이름 입력";
      nameInput.value = record.caption || "";
      nameInput.setAttribute("aria-label", "사진 이름");
      nameInput.maxLength = 80;
      nameInput.addEventListener("change", async () => {
        await savePhoto({...record, caption: nameInput.value.trim()});
        toast("사진 이름을 저장했습니다.");
      });
      card.append(nameInput);
    }

    const actions = document.createElement("div");
    actions.className = "actions";
    if (slotIndex !== null) {
      const replace = document.createElement("button");
      replace.className = "secondary small";
      replace.textContent = record ? "사진 교체" : "사진 등록";
      replace.addEventListener("click", () => chooseFiles(false, slotIndex));
      actions.append(replace);
      if (record) {
        const remove = document.createElement("button");
        remove.className = "danger small";
        remove.textContent = "비우기";
        remove.addEventListener("click", async () => {
          if (confirm(`고정 사진 ${slotIndex+1}을(를) 비울까요?`)) {
            await deletePhoto(record.id);
            await render();
            toast("고정 사진을 비웠습니다.");
          }
        });
        actions.append(remove);
      }
    } else if (record) {
      const remove = document.createElement("button");
      remove.className = "danger small";
      remove.textContent = "삭제";
      remove.addEventListener("click", async () => {
        if (confirm("이 사진을 삭제할까요?")) {
          await deletePhoto(record.id);
          await render();
          toast("사진을 삭제했습니다.");
        }
      });
      actions.append(remove);
    }
    card.append(actions);
    return card;
  }

  async function render() {
    const photos = await allPhotos();
    const fixedGrid = $("fixedGrid");
    const extraGrid = $("extraGrid");
    fixedGrid.replaceChildren();
    extraGrid.replaceChildren();

    for (let slot=0; slot<4; slot++) {
      const record = photos.find(p => p.slot === slot);
      fixedGrid.append(makeCard(record, slot));
    }

    const extras = photos.filter(p => p.slot === null).sort((a,b) => a.createdAt-b.createdAt);
    $("extraCount").textContent = `${extras.length}장`;
    if (!extras.length) {
      const empty = document.createElement("div");
      empty.className = "empty-list";
      empty.textContent = "아직 추가한 사진이 없습니다.";
      extraGrid.append(empty);
    } else {
      extras.forEach(photo => extraGrid.append(makeCard(photo)));
    }
  }

  async function chooseFiles(multiple, slot=null) {
    const picker = document.createElement("input");
    picker.type = "file";
    picker.accept = "image/*";
    picker.multiple = multiple;
    picker.addEventListener("change", async () => {
      const files = Array.from(picker.files || []).filter(f => f.type.startsWith("image/"));
      if (!files.length) return;
      try {
        if (slot !== null) {
          const existing = (await allPhotos()).find(p => p.slot === slot);
          await savePhoto({
            ...(existing ? {id: existing.id} : {}),
            slot, blob: files[0], name: files[0].name, createdAt: Date.now()
          });
          toast("고정 사진을 교체했습니다.");
        } else {
          for (const file of files) {
            await savePhoto({slot:null, blob:file, name:file.name, createdAt:Date.now()});
          }
          toast(`${files.length}장의 사진을 추가했습니다.`);
        }
        await render();
      } catch (err) {
        console.error(err);
        toast("저장에 실패했습니다. 저장공간을 확인해 주세요.");
      }
    });
    picker.click();
  }

  $("addFiles").addEventListener("change", async e => {
    const files = Array.from(e.target.files || []).filter(f => f.type.startsWith("image/"));
    if (!files.length) return;
    try {
      for (const file of files) {
        await savePhoto({slot:null, blob:file, name:file.name, createdAt:Date.now()});
      }
      await render();
      toast(`${files.length}장의 사진을 추가했습니다.`);
    } catch (err) {
      console.error(err);
      toast("저장에 실패했습니다. 사진 용량을 줄여 다시 시도해 주세요.");
    }
    e.target.value = "";
  });

  openDB().then(async database => {
    db = database;
    await render();
  }).catch(err => {
    console.error(err);
    $("storageStatus").textContent = "저장 기능을 사용할 수 없습니다";
    toast("이 브라우저에서 로컬 저장소를 사용할 수 없습니다.");
  });
})();
</script>
</body>
</html>
